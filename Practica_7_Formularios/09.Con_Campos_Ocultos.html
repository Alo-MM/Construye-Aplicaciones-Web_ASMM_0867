<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario con campos ocultos</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<body>

<h2>Formulario con campos ocultos</h2>
<!-- <form>: define el formulario -->
<form action="" method="post">
<!-- <input type="hidden">: guarda datos de forma invisible para enviarlos al servidor -->
<input type="hidden" name="hora" value="3:30">
Ingresa tu nombre:
<!-- <input type="text">: casilla de texto visible -->
<input type="text" name="nombre">
<br>
<!-- <button>: botones para enviar o borrar -->
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
<button type="reset">Borrar <i class="fa fa-trash"></i></button>
</form>

  <footer>Martínez Monárrez Alondra Sofia<br>5°J<br>24308051280867</footer>

</body>
</html>
