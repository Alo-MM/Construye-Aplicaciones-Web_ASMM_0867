<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario con botones</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<body>

<h2>Formulario con botones</h2>
<!-- <form>: define el formulario -->
<form action="" method="post">
Ingresa tu nombre:
<!-- <input type="text">: casilla de texto -->
<input type="text" name="nombre">
<br>
<!-- <button type="submit">: botón de envío interactivo (permite poner iconos <i> dentro) -->
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
<!-- <button type="reset">: botón de borrado interactivo (permite poner iconos <i> dentro) -->
<button type="reset">Borrar <i class="fa fa-trash"></i></button>
</form>

<footer>Martínez Monárrez Alondra Sofia<br>5°J<br>24308051280867</footer>
  
</body>
</html>
