<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario con limitaciones</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<body>

<h2>Formulario con limitaciones</h2>
<!-- <form>: define el formulario -->
<form action="" method="post">
Ingresa tu nombre:
<!-- disabled: deshabilita la casilla (no permite escribir ni enviar su contenido) -->
<input type="text" name="nombre" disabled><br>
<!-- maxlength="5": limita la cantidad máxima de caracteres a escribir (máximo 5) -->
Contraseña:
<input type="password" name="pass" maxlength="5"><br>
<!-- readonly: campo de solo lectura (se puede ver pero no modificar) -->
Comentarios:
<textarea name="comentarios" readonly>

Este es mi comentario y no se puede borrar
</textarea><br>
</form>

  <footer>Martínez Monárrez Alondra Sofia<br>5°J<br>24308051280867</footer>
  
</body>
</html>
