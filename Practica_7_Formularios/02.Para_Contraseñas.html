<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario para contraseñas</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<body>
<h2>Formulario para contraseñas</h2>
<!-- <form>: define el formulario -->
<form action="" method="post">

Ingresa tu usuario:
<!-- <input type="text">: casilla de texto para escribir el usuario -->
<input type="text" name="usuario">
Ingresa tu contraseña:
<!-- <input type="password">: campo que oculta el texto con puntos o asteriscos -->
<input type="password" name="pass">
<br>
<!-- <input type="submit">: botón para enviar el formulario -->
<input type="submit" value="enviar">
<!-- <input type="reset">: botón para limpiar todos los campos -->
<input type="reset" value="borrar">

</form>

</body>
</html>
