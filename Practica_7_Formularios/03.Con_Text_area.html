<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario con text area</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<body>

<h2>Formulario con text area</h2>
<!-- <form>: define el formulario -->
<form action="" method="post">
Ingresa tu nombre:
<!-- <input type="text">: campo de texto simple -->
<input type="text" name="nombre">
<br>
Ingresa tu correo:
<!-- <input type="email">: campo especializado para correo electrónico -->
<input type="email" name="correo">
<br>
Ingresa tus comentarios:
<!-- <textarea>: caja para texto de varias líneas (rows: filas, cols: columnas) -->
<textarea name="comentarios" rows="1" cols="10"></textarea>
<br>
<!-- <input type="submit">: botón de envío | <input type="reset">: botón para borrar -->
<input type="submit" value="enviar">
<input type="reset" value="borrar">
</form>

  <footer>Martínez Monárrez Alondra Sofia<br>5°J<br>24308051280867</footer>
  
</body>
</html>
