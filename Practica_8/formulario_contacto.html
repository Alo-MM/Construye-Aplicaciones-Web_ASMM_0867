<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #a3a4a5;
            color: #333;
        }

        .volver {
            margin-bottom: 15px;
        }

        .tarjeta-form {
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }

        label {
            display: block;
            margin: 12px 0 4px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        .acciones {
            margin-top: 18px;
            text-align: center;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin: 0 4px;
            color: #fff;
        }

        input[type="submit"] {
            background: #2c3e50;
        }

        input[type="reset"] {
            background: #e74c3c;
        }

        a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.9em;
            color: #000;
        }
    </style>
</head>

<body>

    <!-- Enlace para regresar -->
    <div class="volver">
        <a href="Index.html">&larr; Volver al inicio</a>
    </div>

    <!-- Tarjeta del formulario -->
    <div class="tarjeta-form">
        <h1>Contacto de la tienda</h1>

        <!-- Formulario de contacto -->
        <form>
            <!-- Campo Nombre -->
            <label for="nombre">Ingresa tu nombre:</label>
            <input type="text" id="nombre" name="nombre">

            <!-- Campo Correo -->
            <label for="correo">Ingresa tu correo:</label>
            <input type="email" id="correo" name="correo">

            <!-- Campo Comentarios -->
            <label for="comentarios">Ingresa tus comentarios:</label>
            <textarea id="comentarios" name="comentarios"></textarea>

            <!-- Botones Enviar y Borrar -->
            <div class="acciones">
                <input type="submit" value="enviar">
                <input type="reset" value="borrar">
            </div>
        </form>

        <!-- Pie de página -->
        <footer>
            Martínez Monárrez Alondra Sofía<br>
            5°J<br>
            24308051280867
        </footer>
    </div>

</body>

</html>
