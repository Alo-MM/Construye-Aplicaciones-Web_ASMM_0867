<!DOCTYPE html> <!--Señala al navegador que es un documento HTML-->
<html lang="en"> <!--Incica el idioma del documento-->
<head> <!--Estructura de encabezado-->
    <meta charset="UTF-8"> <!--Evita errores en los caracteres de la pagina que no son reconocidos-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Ajusta el documento al dispocitivo que se visualice-->
    <title>Imagenes en HTML</title> <!--Este sera el titulo que aparecera en la pestaña de navegación-->
</head>
<body> <!--Cuerpo del documento (Todo lo que se mostrara)-->
    <h2>Imagenes en HTML</h2> <!--Subtitulo indicando el tema del documento-->
    <h3>Locales</h3> <!--Seccion de imagenes locales-->
    <!--Etiqueta <img> inserta una imagen; src es la ruta y alt el texto alternativo-->
    <img src="caritas.png" alt="Imagen de carita feliz">
    <h3>Locales redismensionado</h3> <!--Seccion de imagenes con dimensiones ajustadas-->
    <!--width y height definen el ancho y alto de la imagen-->
    <img src="imagenes/carita.png" alt="" width="200" height="100">
    <h3>Desde internet</h3> <!--Imagenes insertadas mediante una URL de internet-->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt="">
    <h3>Animaciones</h3> <!--Insercion de imagenes animadas GIF-->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt="">
</body>
</html>
