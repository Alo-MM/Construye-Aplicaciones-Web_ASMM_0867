<!DOCTYPE html> <!--Señala al navegador que es un documento HTML-->
<html lang="en"> <!--Incica el idioma del documento-->
<head> <!--Estructura de encabezado-->
    <meta charset="UTF-8"> <!--Evita errores en los caracteres de la pagina que no son reconocidos-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Ajusta el documento al dispocitivo que se visualice-->
    <title>Enlaces en HTML</title> <!--Este sera el titulo que aparecera en la pestaña de navegación-->
</head>
<body> <!--Cuerpo del documento (Todo lo que se mostrara)-->
    <h2>Tipos de enlaces en HTML</h2> <!--Subtitulo indicando el tema del documento-->
    <p><strong>Enlaces/Hipervinculos a otra pagina del
         mismo sitio.
    </strong></p>
    <!--Etiqueta <a> sirve para crear hipervinculos; href indica el destino-->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>
    <a href="2. Encabezados.html" target="_self"> <!--target="_self" abre el enlace en la misma pestaña-->
        2. Encabezados</a><br>
    <a href="3. Parrafos.html" target="_blank"> <!--target="_blank" abre el enlace en una nueva pestaña-->
        3. Parrafos</a><br>
    <a href="4. Salto de linea.html" target="_parent"> <!--target="_parent" abre el enlace en el marco padre-->
        4. Salto de linea</a><br>
    <a href="5. Enfatizado.html" target="_top"> <!--target="_top" abre el enlace en la ventana completa-->
        5. Enfatizado</a><br>
    <p><strong>Enlaces/Hipervinculos a sitios externos
    </strong></p>
    <!--Enlaces a sitios web externos-->
    <a href="https://www.google.com/">Google</a><br>
    <a href="https://www.youtube.com/" target="_self">
        YouTube</a><br>
    <a href="https://www.facebook.com/" target="_blank">
        FaceBook</a><br>
    <a href="https://www.wikipedia.com/" target="_parent">
        WikiPedia</a><br>
    <a href="https://www.espanol.yahoo.com/" target="_top">
        Yahoo!</a><br>
</body>
</html>
