<!DOCTYPE html> <!--Señala al navegador que es un documento HTML-->
<html lang="en"> <!--Incica el idioma del documento-->

<head> 
    <meta charset="UTF-8"> <!--Evita errores en los caracteres de la pagina que no son reconocidos-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Ajusta el documento al dispocitivo que se visualice-->
    <title>Salto de linea en HTML</title> <!--Este sera el titulo que aparecera en la pestaña de navegación-->
</head>

<body> <!--Cuerpo del documento (Todo lo que se mostrara)-->
    <h1>Lenguaje de programacion</h1> <!--Titulo principal de la pagina-->
    <!--Uso de un parrafo para la informacion-->
    <p>En la actualidad se utilizan diferentes
        lenguajes de programacion tanto para desarrollo
        web, desarrollo movil, entranamiento de inteligencia
        artificial, pero de los mas usados son
        los siguientes:<br> <!--Etiqueta <br> para saltar a la siguiente linea sin cerrar la etiqueta del parraro-->
        Dart<br>
        Flutter<br>
        Python<br>
        Ruby<br>
        Java<br>
        TypeScript<br>
        Entre otros.
    </p>
</body>

</html>
