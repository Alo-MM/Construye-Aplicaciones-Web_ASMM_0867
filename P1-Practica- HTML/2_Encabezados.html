<!DOCTYPE html> <!--Señala al navegador que es un documento HTML-->
<html lang="en"> <!--Incica el idioma del documento-->
    
<head> <!--Estructura de encabezado-->
    <meta charset="UTF-8"> <!--Evita errores en los caracteres de la pagina que no son reconocidos-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Ajusta el documento al dispocitivo que se visualice-->
    <title>Encabezados HTML</title> <!--Este sera el titulo que aparecera en la pestaña de navegación-->
</head>

<body> <!--Cuerpo del documento (Todo lo que se mostrara)-->

    <!--Los titulos van desde el h1 al h6 cambiando de tamaño-->
    <h1>Titulo 1</h1> <!--Titulo más grande,titulo principal y más importante-->
    <h2>Titulo 2</h2> <!--Titulo grande, usado para subtitulos importantes-->
    <h3>Titulo 3</h3> <!--Titulo promedio para textos importandes dentro de los subtitulos-->
    <h4>Titulo 4</h4> <!--Titulo chico para textos no tan importantes pero que se necesitan resaltar-->
    <h5>Titulo 5</h5> <!--Titulo pequeño para textos no importantes-->
    <h6>Titulo 6</h6> <!--Titulo más pequeño sin importancia-->
</body>

</html>
